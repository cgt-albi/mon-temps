# Formulaires de Pages CMS (https://app.pagescms.org), rangés en dossiers.
# Un formulaire = un petit fichier du dossier config/ (réassemblés à la publication, voir scripts/fusion.mjs).
# Ce fichier ne part pas sur le site public : il sert seulement à Pages CMS.

media:
  input: images
  output: /images
  categories:
  - image
content:
- name: infos
  label: 📢 Infos aux agents
  type: group
  items:
  - name: actualites
    label: Actualités et agenda
    type: file
    path: config/actualites.json
    format: json
    fields:
    - name: actualites
      label: Actualités
      description: Les plus récentes s'affichent en premier.
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{fields.date} · {fields.titre}'
      fields:
      - name: date
        label: Date
        type: date
        required: true
      - name: titre
        label: Titre
        type: string
        required: true
      - name: texte
        label: Texte
        type: text
      - name: image
        label: Image (facultative)
        type: image
      - name: lien
        label: Lien « En savoir plus » (facultatif)
        type: string
    - name: agenda
      label: Agenda (rendez-vous à venir)
      description: Un rendez-vous disparaît tout seul une fois sa date passée.
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{fields.date} · {fields.titre}'
      fields:
      - name: date
        label: Date
        type: date
        required: true
      - name: titre
        label: Titre
        type: string
        required: true
      - name: lieu
        label: Lieu
        type: string
  - name: elections
    label: Élections professionnelles
    type: file
    path: config/elections.json
    format: json
    fields:
    - name: elections
      label: Élections professionnelles
      type: object
      fields:
      - name: actif
        label: Afficher le bloc élections
        type: boolean
      - name: titre
        label: Titre
        type: string
      - name: dateScrutin
        label: Date du scrutin
        type: date
      - name: ouvertureVote
        label: Ouverture du vote
        type: date
      - name: afficherDepuisJours
        label: Afficher combien de jours avant
        type: number
      - name: afficherJusquau
        label: Afficher jusqu'au
        type: date
      - name: texteIntro
        label: Texte d'introduction
        type: text
      - name: modalites
        label: Modalités de vote
        type: text
      - name: etapes
        label: Étapes
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.titre}'
        fields:
        - name: titre
          label: Titre
          type: string
        - name: texte
          label: Texte
          type: text
      - name: appel
        label: Appel à voter
        type: text
      - name: questions
        label: Questions fréquentes
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.question}'
        fields:
        - name: question
          label: Question
          type: string
        - name: reponse
          label: Réponse
          type: text
      - name: lienOfficiel
        label: Lien officiel
        type: string
  - name: paie
    label: Date de paie
    type: file
    path: config/paie.json
    format: json
    fields:
    - name: paie
      label: Date de paie
      type: object
      fields:
      - name: actif
        label: Afficher la date de paie
        type: boolean
      - name: decalageJours
        label: Décalage (jours)
        type: number
      - name: exceptions
        label: Exceptions
        type: object
        list: true
        fields:
        - name: mois
          label: Mois (AAAA-MM)
          type: string
          pattern:
            regex: ^\d{4}-\d{2}$
            message: 'Format attendu : 2026-12'
        - name: date
          label: Date de paie
          type: date
      - name: note
        label: Note
        type: text
  - name: message-maj
    label: Message de mise à jour
    type: file
    path: config/appli.json
    format: json
    fields:
    - name: nom
      label: Nom de l'appli
      type: string
      required: true
      hidden: true
    - name: slogan
      label: Slogan
      type: string
      hidden: true
    - name: messageMiseAJour
      label: Message de mise à jour (facultatif)
      description: 'Affiché dans le bandeau « Nouvelle version de l''appli » sur les téléphones, par ex. « Nouveau : vérifiez votre relevé Octime ». Laisser vide pour le message par défaut.'
      type: string
    - name: etablissement
      label: Établissement
      type: string
      hidden: true
    - name: syndicat
      label: Nom du syndicat
      type: string
      hidden: true
    - name: couleur
      label: Couleur principale
      description: Code couleur à 6 chiffres, par exemple
      type: string
      pattern:
        regex: ^#[0-9a-fA-F]{6}$
        message: 'Format attendu : # suivi de 6 caractères, par exemple #E30613'
      hidden: true
    - name: logo
      label: Logo
      description: Affiché en haut du site et de l'appli.
      type: image
      hidden: true
    - name: icone
      label: Icône de l'appli (écran d'accueil du téléphone)
      description: Image carrée de 512 px ou plus. Laisser vide pour garder l'icône actuelle. Toutes les tailles sont fabriquées automatiquement.
      type: image
      hidden: true
    - name: domaine
      label: Nom de domaine (facultatif)
      description: Par exemple montemps.fr, sans https://. Laisser vide pour l'adresse GitHub.
      type: string
      hidden: true
    - name: metiers
      label: Métiers proposés
      type: string
      list: true
      hidden: true
    - name: responsablePublication
      label: Responsable de la publication (mentions légales)
      type: string
      hidden: true
    - name: adressePostale
      label: Adresse postale (mentions légales)
      type: text
      hidden: true
    - name: statistiques
      label: Statistiques d'installation
      type: object
      fields:
      - name: goatcounter
        label: Code GoatCounter (facultatif)
        description: Laisser vide pour ne rien mesurer. Sinon, le nom choisi sur goatcounter.com (par ex. mon-temps).
        type: string
      hidden: true
- name: syndicat
  label: 🏛️ Le syndicat et l'appli
  type: group
  items:
  - name: appli
    label: Nom, logo, couleur et mentions
    type: file
    path: config/appli.json
    format: json
    fields:
    - name: nom
      label: Nom de l'appli
      type: string
      required: true
    - name: slogan
      label: Slogan
      type: string
    - name: messageMiseAJour
      label: Message de mise à jour (facultatif)
      description: 'Affiché dans le bandeau « Nouvelle version de l''appli » sur les téléphones, par ex. « Nouveau : vérifiez votre relevé Octime ». Laisser vide pour le message par défaut.'
      type: string
    - name: etablissement
      label: Établissement
      type: string
    - name: syndicat
      label: Nom du syndicat
      type: string
    - name: couleur
      label: Couleur principale
      description: Code couleur à 6 chiffres, par exemple
      type: string
      pattern:
        regex: ^#[0-9a-fA-F]{6}$
        message: 'Format attendu : # suivi de 6 caractères, par exemple #E30613'
    - name: logo
      label: Logo
      description: Affiché en haut du site et de l'appli.
      type: image
    - name: icone
      label: Icône de l'appli (écran d'accueil du téléphone)
      description: Image carrée de 512 px ou plus. Laisser vide pour garder l'icône actuelle. Toutes les tailles sont fabriquées automatiquement.
      type: image
    - name: domaine
      label: Nom de domaine (facultatif)
      description: Par exemple montemps.fr, sans https://. Laisser vide pour l'adresse GitHub.
      type: string
    - name: metiers
      label: Métiers proposés
      type: string
      list: true
    - name: responsablePublication
      label: Responsable de la publication (mentions légales)
      type: string
    - name: adressePostale
      label: Adresse postale (mentions légales)
      type: text
    - name: statistiques
      label: Statistiques d'installation
      type: object
      fields:
      - name: goatcounter
        label: Code GoatCounter (facultatif)
        description: Laisser vide pour ne rien mesurer. Sinon, le nom choisi sur goatcounter.com (par ex. mon-temps).
        type: string
  - name: contacts
    label: Contacts, réseaux sociaux et liens
    type: file
    path: config/contacts.json
    format: json
    fields:
    - name: contacts
      label: Contacts
      type: object
      fields:
      - name: mailGeneral
        label: Mail général
        type: string
      - name: mailGreve
        label: Mail grève
        type: string
      - name: mailSignalement
        label: Mail de signalement
        type: string
      - name: mailAdhesion
        label: Mail d'adhésion
        type: string
      - name: telephone
        label: Téléphone
        type: string
      - name: adresse
        label: Adresse
        type: text
      - name: local
        label: Local syndical
        type: string
      - name: permanences
        label: Permanences
        type: text
    - name: reseaux
      label: Réseaux sociaux
      description: Coller l'adresse complète de la page (https://…). Un champ vide n'apparaît pas dans l'appli.
      type: object
      fields:
      - name: site
        label: Site web
        type: string
      - name: facebook
        label: Facebook
        type: string
      - name: instagram
        label: Instagram
        type: string
      - name: whatsapp
        label: WhatsApp
        type: string
      - name: tiktok
        label: TikTok
        type: string
      - name: youtube
        label: YouTube
        type: string
      - name: x
        label: X (Twitter)
        type: string
      - name: bluesky
        label: Bluesky
        type: string
      - name: threads
        label: Threads
        type: string
      - name: telegram
        label: Telegram
        type: string
    - name: liens
      label: Liens utiles
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{fields.titre}'
      fields:
      - name: titre
        label: Titre
        type: string
        required: true
      - name: url
        label: Adresse (https://…)
        type: string
        required: true
- name: temps
  label: ⏱️ Temps de travail
  type: group
  items:
  - name: codes
    label: Codes horaires
    type: file
    path: config/codes.json
    format: json
    list:
      collapsible:
        collapsed: true
        summary: '{fields.code} · {fields.libelle}'
    fields:
    - name: code
      label: Code
      type: string
      required: true
    - name: libelle
      label: Libellé
      type: string
      required: true
    - name: type
      label: Type
      type: select
      options:
        values:
        - value: travail
          label: Travail de jour
        - value: nuit
          label: Travail de nuit
        - value: repos
          label: 'Repos : le dû du jour reste à faire (RH, RC…)'
        - value: rtt
          label: 'RTT : comme un repos, compté dans les RTT'
        - value: conge
          label: 'Congé : le jour est retiré du dû'
        - value: recup
          label: Récupération
        - value: cet
          label: Compte épargne-temps
        - value: assimile
          label: 'Absence : vaut le dû du jour, 7 h (maladie, formation, ASA…)'
        - value: greve
          label: Grève
    - name: debut
      label: Début (HH:MM)
      type: string
      pattern:
        regex: ^$|^\d{2}:\d{2}$
        message: 'Format attendu : 08:00'
    - name: fin
      label: Fin (HH:MM)
      type: string
      pattern:
        regex: ^$|^\d{2}:\d{2}$
        message: 'Format attendu : 16:18'
    - name: pauseMin
      label: Pause (minutes)
      type: number
    - name: debut2
      label: Service coupé, reprise (HH:MM, facultatif)
      type: string
      pattern:
        regex: ^$|^\d{2}:\d{2}$
        message: 'Format attendu : 14:00'
    - name: fin2
      label: Service coupé, fin (HH:MM, facultatif)
      type: string
      pattern:
        regex: ^$|^\d{2}:\d{2}$
        message: 'Format attendu : 18:00'
    - name: couleur
      label: Couleur dans le planning (facultatif)
      description: Laisser vide pour une couleur automatique.
      type: select
      options:
        values:
        - value: ocre
          label: Ocre
        - value: sarcelle
          label: Sarcelle
        - value: brique
          label: Brique
        - value: prune
          label: Prune
        - value: olive
          label: Olive
        - value: indigo
          label: Indigo
    - name: compteCA
      label: Décompté des congés annuels
      type: boolean
    - name: compteBonusCA
      label: 'Jour gagné posé (hors saison, fractionnement) : décompté du bonus de congés'
      type: boolean
    - name: compte
      label: Compteur particulier (facultatif)
      type: select
      options:
        values:
        - value: rh
          label: Repos hebdomadaire
        - value: ge
          label: Garde d'enfant malade
  - name: regimes
    label: Régimes de travail et compteurs de jours
    type: file
    path: config/regimes.json
    format: json
    fields:
    - name: regimes
      label: Régimes de travail (postes en 12 h, 10 h, 7 h 48…)
      description: L'agent choisit son régime dans son profil. Il ne voit alors que les codes de travail de son régime (plus repos, congés, absences). Une case vide reprend la règle générale.
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{fields.nom}'
      fields:
      - name: id
        label: Repère technique (unique, sans espace, ne plus le changer ensuite)
        type: string
        required: true
        pattern:
          regex: ^[a-z0-9-]+$
          message: Minuscules, chiffres et tirets seulement, par ex. postes-12h
      - name: nom
        label: Nom affiché à l'agent
        type: string
        required: true
      - name: description
        label: Explication (facultatif)
        type: text
      - name: codes
        label: Codes de travail de ce régime
        description: Écrire les codes tels qu'ils sont dans « Codes horaires », un par ligne (ex. N12, J12).
        type: string
        list: true
      - name: duJournalier
        label: Dû par jour ouvré (facultatif)
        description: Seulement si différent de la règle générale, par ex. 6:30 pour la nuit exclusive (32 h 30 par semaine).
        type: string
        pattern:
          regex: ^$|^\d{1,2}[:h]\d{2}$
          message: 'Format attendu : 6:30'
      - name: rttParAn
        label: RTT par an pour ce régime (facultatif)
        type: number
      - name: droits
        label: Droits propres à ce régime (RC, sujétions…)
        description: Un droit par compteur de jours. Le repère doit être celui du compteur (ex. rc).
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.compteur} : {fields.jours} j'
        fields:
        - name: compteur
          label: Repère du compteur (ex. rc)
          type: string
          required: true
        - name: jours
          label: Jours par an (temps plein)
          type: number
          required: true
    - name: compteurs
      label: Compteurs de jours (RC, sujétions, autres droits…)
      description: Pour compter à part un type de jour. 1) Créer le code dans « Codes horaires » (son type dit l'effet sur le solde). 2) Créer ici le compteur avec ce code. 3) Si le droit dépend du poste,
        le donner dans « Régimes de travail › Droits propres ».
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{fields.nom}'
      fields:
      - name: id
        label: Repère technique (unique, sans espace, ne plus le changer ensuite)
        type: string
        required: true
        pattern:
          regex: ^[a-z0-9-]+$
          message: Minuscules, chiffres et tirets seulement, par ex. rc
      - name: nom
        label: Nom affiché
        type: string
        required: true
      - name: codes
        label: Codes qui consomment ce compteur
        description: Un code par ligne, tel qu'il est dans « Codes horaires » (ex. RC).
        type: string
        list: true
      - name: droitParAn
        label: Droit par an pour tous (facultatif)
        description: Laisser vide si le droit dépend du régime, ou pour un simple décompte sans droit.
        type: number
      - name: proratiseQuotite
        label: Réduit pour les temps partiels
        type: boolean
        default: true
      - name: paliersDJF
        label: Jours gagnés selon les dimanches et fériés travaillés (facultatif)
        description: 'Ex. repos supplémentaires : 10 dimanches/fériés → 1 jour ; 20 → 2 jours. Le plus haut palier atteint compte.'
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.dimanchesFeries} → {fields.jours} j'
        fields:
        - name: dimanchesFeries
          label: À partir de (dimanches et fériés travaillés)
          type: number
          required: true
        - name: jours
          label: Jours gagnés
          type: number
          required: true
      - name: explication
        label: Explication montrée à l'agent (bouton « ? »)
        type: text
      - name: source
        label: Source (texte officiel ou protocole)
        type: string
  - name: regles
    label: Règles de calcul
    type: file
    path: config/regles.json
    format: json
    fields:
    - name: valeurJourneeHeures
      label: Dû par jour ouvré (heures:minutes)
      description: Ce que l'agent doit chaque jour du lundi au vendredi, à temps plein. Écrire par exemple 7:00 ou 7:48.
      type: string
      pattern:
        regex: ^\d{1,2}[:h]\d{2}$
        message: 'Format attendu : 7:00 ou 7:48'
    - name: quotiteParDefaut
      label: Quotité par défaut (%)
      type: number
    - name: rttParAn
      label: RTT par an
      type: number
    - name: caParAn
      label: Congés annuels par an
      type: number
    - name: horsSaisonJours1
      label: Congés hors saison, 1er jour gagné à partir de (jours de CA)
      description: 'Jours de CA pris hors de la période estivale. Charte 2009 : 3 ; note Octime 2026 : 4.'
      type: number
    - name: horsSaisonJours2
      label: Congés hors saison, 2e jour gagné à partir de (jours de CA)
      type: number
    - name: echeanceCA
      label: Date limite pour poser les CA de l'année précédente (MM-JJ)
      type: string
      pattern:
        regex: ^\d{2}-\d{2}$
        message: 'Format attendu : 01-15'
    - name: echeanceBonus
      label: Date limite pour poser les CH-1 et CF-1 (MM-JJ)
      type: string
      pattern:
        regex: ^\d{2}-\d{2}$
        message: 'Format attendu : 04-30'
    - name: rhParAn
      label: Repos hebdomadaires par an
      type: number
    - name: periodeEstivale
      label: Période estivale
      type: object
      fields:
      - name: debut
        label: Début (MM-JJ)
        type: string
        pattern:
          regex: ^\d{2}-\d{2}$
          message: 'Format attendu : 05-01'
      - name: fin
        label: Fin (MM-JJ)
        type: string
        pattern:
          regex: ^\d{2}-\d{2}$
          message: 'Format attendu : 10-31'
    - name: amplitudeMaxHeures
      label: Amplitude maximale (heures)
      type: number
    - name: dureeContinueMaxJourHeures
      label: Durée continue max de jour (heures)
      type: number
    - name: dureeContinueMaxNuitHeures
      label: Durée continue max de nuit (heures)
      type: number
    - name: amplitudeServiceCoupeHeures
      label: Amplitude max d'un service coupé (heures)
      type: number
    - name: vacationMinHeures
      label: Vacation minimale (heures)
      type: number
    - name: reposQuotidienMinHeures
      label: Repos quotidien minimal (heures)
      type: number
    - name: reposHebdoMinHeures
      label: Repos hebdomadaire minimal (heures)
      type: number
    - name: maxSeptJoursHeures
      label: Maximum sur 7 jours (heures)
      type: number
    - name: reposQuinzaineMinJours
      label: Jours de repos minimum par quinzaine
      type: number
    - name: nuitDebut
      label: Début du travail de nuit (HH:MM)
      type: string
      pattern:
        regex: ^\d{2}:\d{2}$
        message: 'Format attendu : 21:00'
    - name: nuitFin
      label: Fin du travail de nuit (HH:MM)
      type: string
      pattern:
        regex: ^\d{2}:\d{2}$
        message: 'Format attendu : 06:00'
    - name: lundiPentecoteTravaille
      label: Lundi de Pentecôte travaillé (journée de solidarité)
      type: boolean
    - name: delaiPrevenanceHeures
      label: Délai de prévenance (heures)
      type: number
    - name: heuresAnnuellesTauxHoraire
      label: Heures annuelles pour le taux horaire
      type: number
    - name: majorationNuitPct
      label: Majoration de nuit (%)
      type: number
    - name: indemniteDimancheFerie8h
      label: Indemnité dimanche / férié pour 8 h (€)
      type: number
    - name: coefHeuresSup1
      label: Coefficient heures sup (premières heures)
      type: number
    - name: coefHeuresSup2
      label: Coefficient heures sup (au-delà)
      type: number
    - name: seuilHeuresSup
      label: Seuil de changement de coefficient (heures)
      type: number
    - name: maladieTauxPct
      label: Arrêt maladie
      taux après carence (%): null
      type: number
    - name: maladieJoursTauxPlein
      label: Arrêt maladie
      jours à ce taux: null
      type: number
    - name: gardeEnfantJours
      label: Jours pour garde d'enfant malade
      type: number
    - name: aValider
      label: Valeurs encore « à valider »
      description: Repères techniques des valeurs affichées « provisoire ». Retirer une ligne quand la valeur est confirmée.
      type: string
      list: true
- name: salaires
  label: 💶 Salaires et primes
  type: group
  items:
  - name: baremes
    label: Barèmes (point d'indice, SMIC, grilles)
    type: file
    path: config/baremes.json
    format: json
    fields:
    - name: pointIndice
      label: Valeur du point d'indice
      description: Ajouter une ligne pour chaque revalorisation. L'appli prend la dernière ligne dont la date est passée.
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{fields.date} · {fields.valeur} €'
      fields:
      - name: date
        label: Date d'effet
        type: date
        required: true
      - name: valeur
        label: Valeur annuelle du point (€)
        type: number
        required: true
      - &id001
        name: statut
        label: Statut
        type: select
        options:
          values:
          - value: officiel
            label: Officiel
          - value: annonce
            label: Annoncé (affiché « provisoire »)
      - &id002
        name: source
        label: Source
        type: string
    - name: indiceMinimum
      label: Indice minimum de traitement
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{fields.date} · indice {fields.indice}'
      fields:
      - name: date
        label: Date d'effet
        type: date
        required: true
      - name: indice
        label: Indice majoré
        type: number
        required: true
      - *id001
      - *id002
    - name: smic
      label: SMIC
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{fields.date} · {fields.horaire} €/h'
      fields:
      - name: date
        label: Date d'effet
        type: date
